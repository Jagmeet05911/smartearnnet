<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEarn - ਸਮਾਰਟ ਕਮਾਈ ਪਲੇਟਫਾਰਮ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: #38bdf8; }
        .lang-btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; }
        .card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
        nav { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        nav button { background: rgba(51, 65, 85, 0.8); color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px 18px; border-radius: 12px; cursor: pointer; white-space: nowrap; font-weight: 600; }
        nav button.active { background: #38bdf8; color: #0f172a; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 14px; }
        input, select { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(90deg, #38bdf8, #3b82f6); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-secondary { background: #22c55e; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .stat-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; text-align: center; }
        .stat-box h3 { font-size: 24px; color: #4ade80; margin-top: 5px; }
        .task-card { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .section { display: none; }
        .section.active { display: block; }
        .tag { background: #22c55e; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .otp-box { background: rgba(56, 189, 248, 0.1); border: 1px dashed #38bdf8; padding: 15px; border-radius: 8px; margin-top: 10px; }
</style>
</head>
<body>
    <header>
        <div class="logo">💎 SmartEarn</div>
        <button class="lang-btn" id="langBtn">English</button>
    </header>
    <div class="container">
        <!-- Auth Section -->
        <div id="authSection" class="card">
            <h2 id="authTitle" style="margin-bottom: 15px;">ਅਕਾਊਂਟ ਬਣਾਓ (Sign Up)</h2>
            <div class="form-group" id="nameGroup">
                <label id="lblFullname">ਪੂਰਾ ਨਾਮ (Full Name)</label>
                <input type="text" id="fullname" placeholder="ਆਪਣਾ ਪੂਰਾ ਨਾਮ ਲਿਖੋ">
            </div>
            <div class="form-group">
                <label id="lblAuthInput">ਮੋਬਾਈਲ ਨੰਬਰ ਜਾਂ ਈਮੇਲ</label>
                <input type="text" id="authInput" placeholder="9876543210 / example@gmail.com">
            </div>
            <div class="form-group">
                <label id="lblPass">ਪਾਸਵਰਡ (Password)</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-primary" id="btnSendOtp">OTP ਕੋਡ ਭੇਜੋ</button>
            <div id="otpContainer" class="otp-box" style="display:none;">
                <p style="font-size:13px; color:#38bdf8; margin-bottom:8px;">
                    ਕੋਡ ਭੇਜ ਦਿੱਤਾ ਗਿਆ ਹੈ। <strong>(ਟੈਸਟਿੰਗ ਲਈ OTP: 1234 ਵਰਤੋ)</strong>
                </p>
                <div class="form-group">
                    <input type="text" id="otpCode" placeholder="4-ਅੰਕਾਂ ਦਾ OTP" maxlength="4" style="text-align:center; font-size:18px; letter-spacing: 5px;">
                </div>
                <button class="btn-secondary
