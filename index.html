<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEarn - ਕਮਾਈ ਕਰੋ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .auth-box, .dashboard {
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #4338ca;
        }

        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #4f46e5;
            cursor: pointer;
        }

        /* Wallet Card */
        .balance-card {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .balance-item h3 {
            font-size: 22px;
            margin-top: 5px;
        }

        /* Task List */
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #1f2937;
        }

        .task-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info h4 {
            font-size: 15px;
            color: #111827;
        }

        .task-info p {
            font-size: 13px;
            color: #10b981;
            font-weight: bold;
            margin-top: 4px;
        }

        .btn-small {
            padding: 8px 14px;
            font-size: 13px;
            width: auto;
        }

        .btn-disabled {
            background: #9ca3af !important;
            cursor: not-allowed;
        }

        .logout-btn {
            background: #ef4444;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>💎 SmartEarn</h1>
    </header>

    <!-- Sign Up / Login Form -->
    <div id="authBox" class="auth-box">
        <h2 id="authTitle" style="margin-bottom: 15px;">ਅਕਾਊਂਟ ਬਣਾਓ</h2>
        
        <div class="form-group" id="nameGroup">
            <label>ਪੂਰਾ ਨਾਮ</label>
            <input type="text" id="userName" placeholder="ਆਪਣਾ ਨਾਮ ਲਿਖੋ">
        </div>

        <div class="form-group">
            <label>ਈਮੇਲ / ਫੋਨ ਨੰਬਰ</label>
            <input type="text" id="userEmail" placeholder="ਈਮੇਲ ਜਾਂ ਫੋਨ ਨੰਬਰ">
        </div>

        <div class="form-group">
            <label>ਪਾਸਵਰਡ</label>
            <input type="password" id="userPassword" placeholder="ਪਾਸਵਰਡ ਲਿਖੋ">
        </div>

        <button class="btn" id="authBtn" onclick="handleAuth()">ਰਜਿਸਟਰ ਕਰੋ</button>
        <div class="toggle-link" id="toggleAuth" onclick="toggleAuthMode()">ਪਹਿਲਾਂ ਤੋਂ ਅਕਾਊਂਟ ਹੈ? ਲੌਗਇਨ ਕਰੋ</div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="dashboard hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>ਜੀ ਆਇਆਂ ਨੂੰ, <span id="displayName">User</span>! 👋</h3>
        </div>

        <!-- Balance Section -->
        <div class="balance-card">
            <div class="balance-item">
                <span>ਕੁੱਲ ਬੈਲੈਂਸ</span>
                <h3 id="walletBalance">₹0.00</h3>
            </div>
            <div class="balance-item">
                <span>ਕੁੱਲ ਕਮਾਈ</span>
                <h3 id="totalEarnings">₹0.00</h3>
            </div>
        </div>

        <!-- Task Section -->
        <h3 class="section-title">ਉਪਲਬਧ ਟਾਸਕ</h3>
        
        <div class="task-card">
            <div class="task-info">
                <h4>ਵੀਡੀਓ ਐਡ ਦੇਖੋ (15 ਸੈਕਿੰਡ)</h4>
                <p>+ ₹15.00</p>
            </div>
            <button class="btn btn-small" id="task1Btn" onclick="startTask(1, 15, 15)">ਟਾਸਕ ਕਰੋ</button>
        </div>

        <div class="task-card">
            <div class="task-info">
                <h4>ਸਪਾਂਸਰਡ ਆਫਰ ਵਿਜ਼ਿਟ ਕਰੋ</h4>
                <p>+ ₹25.00</p>
            </div>
            <button class="btn btn-small" id="task2Btn" onclick="startTask(2, 20, 25)">ਟਾਸਕ ਕਰੋ</button>
        </div>

        <div class="task-card">
            <div class="task-info">
                <h4>ਐਪ ਰਿਵਿਊ / ਸਰਵੇ ਪੂਰਾ ਕਰੋ</h4>
                <p>+ ₹50.00</p>
            </div>
            <button class="btn btn-small" id="task3Btn" onclick="startTask(3, 30, 50)">ਟਾਸਕ ਕਰੋ</button>
        </div>

        <!-- Withdrawal Section -->
        <h3 class="section-title" style="margin-top: 25px;">ਪੈਸੇ ਕਢਵਾਓ (Withdraw)</h3>
        <div style="background: #f9fafb; padding: 15px; border-radius: 10px; border: 1px solid #e5e7eb;">
            <div class="form-group">
                <label>UPI ID (ਜਿਵੇਂ test@upi)</label>
                <input type="text" id="upiId" placeholder="ਆਪਣੀ UPI ID ਪਾਓ">
            </div>
            <button class="btn" style="background: #10b981;" onclick="withdrawMoney()">Withdraw Request</button>
        </div>

        <button class="btn logout-btn" onclick="logout()">ਲੌਗਆਊਟ (Logout)</button>
    </div>
</div>

<script>
    let isLogin = false;
    let currentUser = null;

    // Check if user is logged in
    window.onload = function() {
        const savedUser = localStorage.getItem('smartEarnUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            showDashboard();
        }
    };

    function toggleAuthMode() {
        isLogin = !isLogin;
        document.getElementById('authTitle').innerText = isLogin ? "ਲੌਗਇਨ ਕਰੋ" : "ਅਕਾਊਂਟ ਬਣਾਓ";
        document.getElementById('nameGroup').style.display = isLogin ? "none" : "block";
        document.getElementById('authBtn').innerText = isLogin ? "ਲੌਗਇਨ" : "ਰਜਿਸਟਰ ਕਰੋ";
        document.getElementById('toggleAuth').innerText = isLogin ? "ਨਵਾਂ ਅਕਾਊਂਟ ਬਣਾਓ" : "ਪਹਿਲਾਂ ਤੋਂ ਅਕਾਊਂਟ ਹੈ? ਲੌਗਇਨ ਕਰੋ";
    }

    function handleAuth() {
        const email = document.getElementById('userEmail').value.trim();
        const password = document.getElementById('userPassword').value.trim();
        const name = document.getElementById('userName').value.trim();

        if (!email || !password) {
            alert("ਕਿਰਪਾ ਕਰਕੇ ਸਾਰੀ ਜਾਣਕਾਰੀ ਭਰੋ!");
            return;
        }

        if (isLogin) {
            const storedData = localStorage.getItem('userData_' + email);
            if (storedData) {
                const user = JSON.parse(storedData);
                if (user.password === password) {
                    currentUser = user;
                    localStorage.setItem('smartEarnUser', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    alert("ਗਲਤ ਪਾਸਵਰਡ!");
                }
            } else {
                alert("ਇਹ ਅਕਾਊਂਟ ਨਹੀਂ ਮਿਲਿਆ! ਪਹਿਲਾਂ ਰਜਿਸਟਰ ਕਰੋ।");
            }
        } else {
            if (!name) {
                alert("ਕਿਰਪਾ ਕਰਕੇ ਨਾਮ ਭਰੋ!");
                return;
            }
            currentUser = {
                name: name,
                email: email,
                password: password,
                balance: 0,
                earnings: 0,
                completedTasks: []
            };
            saveUserData();
            localStorage.setItem('smartEarnUser', JSON.stringify(currentUser));
            showDashboard();
        }
    }

    function saveUserData() {
        if (currentUser) {
            localStorage.setItem('userData_' + currentUser.email, JSON.stringify(currentUser));
            localStorage.setItem('smartEarnUser', JSON.stringify(currentUser));
        }
    }

    function showDashboard() {
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('displayName').innerText = currentUser.name;
        updateUI();
    }

    function updateUI() {
        document.getElementById('walletBalance').innerText = '₹' + currentUser.balance.toFixed(2);
        document.getElementById('totalEarnings').innerText = '₹' + currentUser.earnings.toFixed(2);

        // Update Task Buttons
        [1, 2, 3].forEach(taskId => {
            const btn = document.getElementById('task' + taskId + 'Btn');
            if (currentUser.completedTasks.includes(taskId)) {
                btn.innerText = "ਪੂਰਾ ਹੋ ਗਿਆ";
                btn.classList.add('btn-disabled');
                btn.disabled = true;
            }
        });
    }

    function startTask(taskId, seconds, reward) {
        const btn = document.getElementById('task' + taskId + 'Btn');
        btn.disabled = true;
        let timeLeft = seconds;

        const timer = setInterval(() => {
            btn.innerText = `ਇੰਤਜ਼ਾਰ ਕਰੋ (${timeLeft}s)`;
            timeLeft--;

            if (timeLeft < 0) {
                clearInterval(timer);
                currentUser.balance += reward;
                currentUser.earnings += reward;
                currentUser.completedTasks.push(taskId);
                saveUserData();
                updateUI();
                alert(`ਵਧਾਈਆਂ! ਤੁਹਾਨੂੰ ₹${reward} ਮਿਲ ਗਏ ਹਨ।`);
            }
        }, 1000);
    }

    function withdrawMoney() {
        const upi = document.getElementById('upiId').value.trim();
        if (!upi) {
            alert("ਕਿਰਪਾ ਕਰਕੇ UPI ID ਭਰੋ!");
            return;
        }

        if (currentUser.balance < 100) {
            alert("ਘੱਟੋ-ਘੱਟ ₹100 ਹੋਣ 'ਤੇ ਹੀ Withdraw ਹੋ ਸਕਦਾ ਹੈ।");
            return;
        }

        alert(`ਤੁਹਾਡੀ ₹${currentUser.balance} ਦੀ ਰਿਕਵੈਸਟ UPI: ${upi} 'ਤੇ ਦਰਜ ਹੋ ਗਈ ਹੈ!`);
        currentUser.balance = 0;
        saveUserData();
        updateUI();
    }

    function logout() {
        localStorage.removeItem('smartEarnUser');
        location.reload();
    }
</script>

</body>
</html>
